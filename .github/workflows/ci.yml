name: Dobby Core CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Spin up a real Redis instance inside the GitHub runner for integration tests
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle' # Automatically caches Gradle dependencies to speed up future builds!

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x gradlew

      - name: Verify Code Style Conventions (ktlint)
        run: ./gradlew ktlintCheck

      - name: Run Build and Unit Tests
        # We pass dummy env values just so Spring Boot boots up cleanly during tests
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./gradlew build