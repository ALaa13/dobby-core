services:

  redis:
    image: redis:alpine
    container_name: dobby-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - dobby-network
    command: redis-server --requirepass ${REDIS_PASSWORD} --bind 0.0.0.0
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dobby-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PASSWORD=${REDIS_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/api/v1/" ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - dobby-network
    restart: unless-stopped

networks:
  dobby-network:
    driver: bridge

volumes:
  redis_data: